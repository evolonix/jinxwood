<html lang="en">

    <title>Jinxwood — Games with a Little Mischief and a Little Magic</title>
    <!-- The hero art is the home page's largest paint, but the <img> that asks
         for it only exists once React has rendered. Preloading starts the
         download with the HTML instead. scripts/build-routes.mjs removes these
         from every route but "/". Keep the lists in step with hero.tsx. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="not all and (max-aspect-ratio: 4/5)"
      imagesrcset="/img/hero/hero-768.avif 768w, /img/hero/hero-1280.avif 1280w, /img/hero/hero-1920.avif 1920w, /img/hero/hero-2560.avif 2560w"
      imagesizes="100vw"
      data-hero-preload
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(max-aspect-ratio: 4/5)"
      imagesrcset="/img/hero/hero-portrait-640.avif 640w, /img/hero/hero-portrait-960.avif 960w, /img/hero/hero-portrait-1280.avif 1280w"
      imagesizes="100vw"
      data-hero-preload
    />
    <style>
      /* Paint the page color before the bundled stylesheet arrives, so there
         is no white flash. Keep in sync with --color-night in index.css. */
      html {
        background-color: #2b1e3f;
        color-scheme: dark;
      }
      /* The loading screen inside #root, until the app replaces it. It
         stays invisible for half a second, so a quick load never shows it,
         then fades in: Jinx's eyes in the dark, their lids blinking now and
         then, with three dots that glow in turn. */
      .loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.5rem;
        background: radial-gradient(
          ellipse at center,
          #24152f 0%,
          #170d22 55%,
          #0f0817 100%
        );
        opacity: 0;
        animation: loading-in 0.4s ease-out 0.5s forwards;
      }
      .loading-eyes {
        position: relative;
        width: min(16rem, 60vw);
      }
      .loading-eyes img {
        display: block;
        width: 100%;
        height: auto;
      }
      .loading-eyes svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* The lids, drawn as in jinx-eyes.tsx (where the paths are explained),
         blink every few seconds. */
      .loading-lids {
        opacity: 0;
        animation: loading-lids 3.2s ease-in-out 1s infinite;
      }
      .loading-rim {
        opacity: 0;
        animation: loading-rim 3.2s ease-in-out 1s infinite;
      }
      .loading-lid-art {
        animation: loading-lid-art 3.2s ease-in-out 1s infinite;
      }
      .loading p {
        margin: 0;
        font-family: "Fraunces Variable", Georgia, serif;
        font-size: 1.5rem;
        font-weight: 600;
        color: #f4ede0;
      }
      .loading-dots {
        display: flex;
        gap: 0.75rem;
      }
      .loading-dots span {
        width: 0.625rem;
        height: 0.625rem;
        border-radius: 50%;
        background: #f2a93b;
        opacity: 0.25;
        animation: loading-dot 1.2s ease-in-out infinite;
      }
      .loading-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .loading-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes loading-in {
        to {
          opacity: 1;
        }
      }
      @keyframes loading-lids {
        0%,
        88% {
          opacity: 0;
          transform: translateY(0);
        }
        89% {
          opacity: 1;
          transform: translateY(0);
        }
        94% {
          transform: translateY(500px);
        }
        99% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(0);
        }
      }
      @keyframes loading-lid-art {
        0%,
        89%,
        99%,
        100% {
          opacity: 1;
        }
        94% {
          opacity: 0.2;
        }
      }
      @keyframes loading-rim {
        0%,
        89% {
          opacity: 0;
        }
        92%,
        96% {
          opacity: 1;
        }
        99%,
        100% {
          opacity: 0;
        }
      }
      @keyframes loading-dot {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
          box-shadow: 0 0 0.75rem rgb(242 169 59 / 0.6);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading {
          animation-duration: 0s;
        }
        .loading-lids,
        .loading-rim,
        .loading-lid-art,
        .loading-dots span {
          animation: none;
        }
        .loading-dots span {
          opacity: 0.6;
        }
      }
    </style>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // Converts the ?/ redirect written by 404.html back into the real URL and
      // replaces it in history so the SPA router can pick it up.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
  </head>
