<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The favicon and app icons are generated from the icon art by
         scripts/build-brand.mjs. -->
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2B1E3F" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Jinxwood is a small game studio making warm, well-crafted games with a little mischief and a little magic. Home of Pinochle: Two-Handed."
    />
    <meta property="og:site_name" content="Jinxwood" />
    <meta
      property="og:title"
      content="Jinxwood — Games with a Little Mischief and a Little Magic"
    />
    <meta
      property="og:description"
      content="A small game studio making warm, well-crafted games. Home of Pinochle: Two-Handed."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://jinxwood.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Jinxwood — Games with a Little Mischief and a Little Magic</title>
    <!-- The hero art is the home page's largest paint, but the <img> that asks
         for it only exists once React has rendered. Preloading starts the
         download with the HTML instead. scripts/build-routes.mjs removes these
         from every route but "/". Keep the lists in step with hero.tsx. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="not all and (max-aspect-ratio: 4/5)"
      imagesrcset="/img/hero/hero-768.avif 768w, /img/hero/hero-1280.avif 1280w, /img/hero/hero-1920.avif 1920w, /img/hero/hero-2560.avif 2560w"
      imagesizes="100vw"
      data-hero-preload
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(max-aspect-ratio: 4/5)"
      imagesrcset="/img/hero/hero-portrait-640.avif 640w, /img/hero/hero-portrait-960.avif 960w, /img/hero/hero-portrait-1280.avif 1280w"
      imagesizes="100vw"
      data-hero-preload
    />
    <style>
      /* Paint the page colour before the bundled stylesheet arrives, so there
         is no white flash. Keep in sync with --color-night in index.css. */
      html {
        background-color: #2b1e3f;
        color-scheme: dark;
      }
    </style>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // Converts the ?/ redirect written by 404.html back into the real URL and
      // replaces it in history so the SPA router can pick it up.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
